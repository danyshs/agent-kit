name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: lint, and the evals sandbox on sandbox-exec
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - name: Install tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install shellcheck
          uv tool install ruff==0.17.6
          uv tool install pyright==1.1.414
      # one eval test runs the shipped tiger-style suite against an installed copy of the skill;
      # it also lists the steering folder, which a fresh runner doesn't have
      - name: Install the tiger-style skill for the evals
        run: |
          mkdir -p ~/.kiro/skills ~/.kiro/steering
          cp -R plugins/tiger-style/skills/tiger-style ~/.kiro/skills/
      - name: Lint
        run: ./lint.sh
      - name: Guard tests
        run: python3 -I plugins/guards/tests/test_guard.py
      - name: Evals
        run: tools/evals/bin/check
      - name: Trajectory
        run: tools/trajectory/bin/check

  linux:
    # the evals sandbox on Linux is bwrap, which needs user namespaces that Ubuntu 24.04's
    # AppArmor blocks for unprivileged users by default
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          uv tool install ruff==0.17.6
          uv tool install pyright==1.1.414
      - name: Install the tiger-style skill for the evals
        run: |
          mkdir -p ~/.kiro/skills ~/.kiro/steering
          cp -R plugins/tiger-style/skills/tiger-style ~/.kiro/skills/
      - name: Guard tests
        run: python3 -I plugins/guards/tests/test_guard.py
      - name: Evals
        run: tools/evals/bin/check
      - name: Trajectory
        run: tools/trajectory/bin/check
